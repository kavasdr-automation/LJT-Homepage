# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : &name "Junteng Liu"
description              : &description "Junteng Liu's personal homepage"
url                      : "https://kavasdr-automation.github.io"
baseurl                  : ""
repository               : "kavasdr-automation/LJT-Homepage"
teaser                   : # filename of teaser fallback teaser image like logo88.png

